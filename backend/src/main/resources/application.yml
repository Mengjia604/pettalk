spring:
  application:
    name: pettalk
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/pettalk?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

wechat:
  app-id: ${WECHAT_APP_ID:wxb55f7224867b4779}
  app-secret: ${WECHAT_APP_SECRET:}
  code2session-url: ${WECHAT_CODE2SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
  mock-enabled: ${WECHAT_MOCK_ENABLED:false}

jwt:
  secret: ${JWT_SECRET:pettalk-dev-secret-please-change-in-production-2026}
  expire-minutes: ${JWT_EXPIRE_MINUTES:10080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
